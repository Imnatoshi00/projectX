<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Feedback</title>

  <!-- ✅ REQUIRED for mobile -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="style.css">

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #f4f4f4;
      font-family: Arial, sans-serif;
    }

    .container {
      width: 100%;
      max-width: 400px;
      padding: 20px;
      margin: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
      border-radius: 10px;
      background: #fff;
      text-align: center;
    }

    h2 {
      margin-bottom: 20px;
    }

    label {
      display: block;
      text-align: left;
      font-weight: bold;
      margin-bottom: 5px;
    }

    input, textarea {
      width: 100%;
      padding: 10px;
      margin-bottom: 15px;
      border: 1px solid #ccc;
      border-radius: 5px;
      font-size: 16px; /* prevents mobile zoom */
      box-sizing: border-box;
    }

    textarea {
      resize: vertical;
    }

    .btn {
      width: 100%;
      padding: 12px;
      font-size: 16px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      background-color: #4CAF50;
      color: white;
    }

    .btn:hover {
      background-color: #45a049;
    }

    /* 📱 Small screen tweaks */
    @media (max-width: 480px) {
      .container {
        padding: 15px;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <h2>Feedback</h2>

    <label for="fbName">Name</label>
    <input type="text" id="fbName" placeholder="Enter your name">

    <label for="fbEmail">Email</label>
    <input type="email" id="fbEmail" placeholder="Enter your email">

    <label for="fbMessage">Your Feedback</label>
    <textarea id="fbMessage" rows="4" placeholder="Write your feedback here..."></textarea>

    <button class="btn" onclick="submitFeedback()">Submit Feedback</button>
  </div>

  <script>
    function submitFeedback() {
      const name = document.getElementById("fbName").value.trim();
      const email = document.getElementById("fbEmail").value.trim();
      const message = document.getElementById("fbMessage").value.trim();

      if (!name || !email || !message) {
        alert("Please fill all fields.");
        return;
      }

      alert("Thank you for your feedback!");

      document.getElementById("fbName").value = "";
      document.getElementById("fbEmail").value = "";
      document.getElementById("fbMessage").value = "";

      window.location.href = "index.html";
    }
  </script>

</body>
</html>
