<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Welcome</title>

  <!-- ✅ MOBILE RESPONSIVE -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="style2.css">

  <style>
/* 🌐 NAVBAR */
nav {
  position: fixed;
  left: 0;
  top: 0;
  height: 100%;
  width: 100px;
  background-color: rgba(51, 51, 51, 0.5);
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  padding: 20px 10px;
  z-index: 800;
  backdrop-filter: blur(5px);
}

nav .logo {
  font-weight: bold;
  font-size: 1.2em;
  margin-bottom: 30px;
  color: white;
}

nav .nav-links {
  display: flex;
  flex-direction: column;
  gap: 20px;
  width: 100%;
}

nav .nav-links a {
  color: white;
  text-decoration: none;
  font-weight: bold;
  padding: 10px;
  border-radius: 6px;
  transition: background 0.3s, color 0.3s;
}

nav .nav-links a:hover {
  background-color: rgba(255, 255, 255, 0.2);
  color: #ffd700;
}

/* 📦 MAIN CONTENT */
.container {
  margin-left: 140px;
  padding: 20px;
}

/* 📱 MOBILE NAVBAR */
@media (max-width: 768px) {
  nav {
    width: 100%;
    height: auto;
    flex-direction: row;
    align-items: center;
    padding: 10px 15px;
  }

  nav .logo {
    margin-bottom: 0;
    margin-right: auto;
  }

  nav .nav-links {
    display: none;
    flex-direction: column;
    background: rgba(51, 51, 51, 0.9);
    position: absolute;
    top: 60px;
    left: 0;
    width: 100%;
    padding: 15px;
  }

  nav .nav-links.active {
    display: flex;
  }

  .hamburger {
    display: block;
    cursor: pointer;
  }

  .hamburger div {
    width: 25px;
    height: 3px;
    background: white;
    margin: 4px 0;
  }

  .container {
    margin-left: 0;
    margin-top: 80px;
  }
}
  </style>
</head>

<body>

  <!-- NAVBAR -->
  <nav>
    <div class="logo">MySite</div>

    <div class="nav-links" id="navLinks">
      <a href="index.html">Login</a>
      <a href="signup.html">Signup</a>
      <a href="feedback.html">Feedback</a>
      <a href="index.html" onclick="logout()">Logout</a>
    </div>

    <div class="hamburger" onclick="toggleMenu()">
      <div></div>
      <div></div>
      <div></div>
    </div>
  </nav>

  <!-- MAIN CONTENT -->
  <div class="container">
    <button class="toggle-btn" onclick="toggleMode()">🌙</button>

    <h2>Welcome 🎉</h2>
    <p>
      Account logged in successfully!<br>
      Enjoy the mini game below!
    </p>

    <div class="game">
      <p>Time: <span id="time">30</span>s | Score: <span id="score">0</span></p>
      <div id="target"></div>
    </div>

    <button id="restartBtn" onclick="startGame()">Restart Game</button>

    <button class="logout-btn" onclick="logout()">Logout</button>
  </div>

  <script src="script2.js"></script>
  <script>
    function toggleMenu() {
      document.getElementById("navLinks").classList.toggle("active");
    }
  </script>
</body>
</html>
