<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Sign Up</title>

  <!-- ✅ REQUIRED for mobile responsiveness -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    <button class="toggle-btn" onclick="toggleMode()">🌙</button>

    <h2>LOGIN</h2>

    <div class="input-group">
      <label>Email</label>
      <input type="email" required>
    </div>

    <div class="input-group">
      <label>Password</label>
      <input type="password" id="password" required>
    </div>

    <div class="input-group">
      <label>Confirm Password</label>
      <input type="password" id="confirmPassword" required>
    </div>

    <p id="errorMsg" class="error-msg"></p>

    <button class="btn" id="signupBtn" onclick="signUp()">Sign in</button>

    <button class="small-btn" onclick="registerNewAccount()">
      Register a new account
    </button>

    <button class="small-btn" onclick="window.location.href='feedback.html'">
      Give Feedback
    </button>
  </div>

  <script>
    function registerNewAccount() {
      alert("Redirecting to registration page...");
    }
  </script>

  <script src="script.js"></script>
</body>
</html>
